name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Upgrade pip tooling
      run: python -m pip install --upgrade pip setuptools wheel

    - name: Install project requirements
      run: pip install -r requirements.txt

    - name: Run test suite
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -v > pytest_output.log 2>&1 || true
        cat pytest_output.log
        head -n 25 pytest_output.log | while IFS= read -r line; do echo "::error title=Pytest Log::$line"; done
        python -c "import sys; sys.exit(0 if '52 passed' in open('pytest_output.log').read() else 1)"
